<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mineville Zeqa Bedfight</title>
  <!-- SEO Meta Tags -->
  <meta name="description" content="Official website for Mineville Zeqa Bedfight. Check out the leaderboard, tournament updates, and get tier tested on our Discord server.">
  <meta name="keywords" content="Minecraft, Bedfight, Zeqa, Mineville, Leaderboard, Tier Testing, Discord, PvP">
  <link rel="icon" type="image/png" href="/assets/logo.png">
  
  <!-- Google Fonts: Outfit and Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <div class="top-banner">

  <header class="navbar">

      <!-- Left: Logo (moved from center to left corner) -->

      <!-- Right: Links & Discord Button -->
      <div class="nav-right">
        <nav class="nav-links">
          <a href="#/home" class="nav-link" id="nav-home">Home</a>
          <a href="#/about" class="nav-link" id="nav-about">About</a>
          <a href="#/leaderboard" class="nav-link" id="nav-leaderboard">Leaderboard</a>

          <a href="#/tournaments" class="nav-link" id="nav-tournaments">Tournaments</a>

        <!-- Discord Logo Link (Replaces Sign In with Discord) -->

    </div>

  <!-- Page Content Target -->
  <main id="app-view" class="main-content">
    <!-- Rendered Dynamically by app.js -->
    <div class="loading-container">
      <div class="spinner"></div>
    </div>
  </main>

  <!-- Staff List Sidebar Drawer -->
  <div id="drawer-overlay" class="drawer-overlay"></div>
  <div id="staff-drawer" class="drawer">
    <div class="drawer-header">
      <h2 class="drawer-title">Staff Team</h2>
      <button id="close-drawer-btn" class="close-drawer-btn">&times;</button>
    </div>
    <div class="drawer-body" id="staff-list-container">
      <!-- Populated via API -->
      <div class="loading-container">
        <div class="spinner"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <p>&copy; 2026 Mineville Zeqa Bedfight. All rights reserved.</p>

      <div class="footer-links">
        <a href="https://discord.gg/Rb2Wwfft4Z" target="_blank" rel="noopener noreferrer">Discord Server</a>
        <span>&bull;</span>
